# Workspace + catálogo de versiones centralizado.
# Regla del proyecto: las versiones se declaran UNA vez aquí y los package.json
# referencian con "catalog:". Nada de versiones dispersas por el repo.
packages:
  - apps/*
  - packages/*
  # services/* son proyectos Python (uv), NO forman parte del workspace pnpm.

catalog:
  # --- toolchain ---
  typescript: ^5.9.3
  tsx: ^4.19.2
  "@types/node": ^22.20.1
  prettier: ^3.4.2
  rimraf: ^6.0.1
  # carga el .env del root en comandos Prisma locales (migrate dev / studio / reset);
  # Prisma solo mira ./ y ./prisma, no sube al root del monorepo.
  dotenv-cli: ^11.0.0

  # --- lint ---
  eslint: ^9.17.0
  typescript-eslint: ^8.20.0
  "@eslint/js": ^9.17.0
  "@eslint/eslintrc": ^3.2.0

  # --- test ---
  vitest: ^2.1.8

  # --- validación de entorno / dominio ---
  zod: ^3.25.0

  # --- prisma (ORM v6; v7 exige driver adapters + prisma.config.ts, ver packages/db) ---
  prisma: 6.19.3
  "@prisma/client": 6.19.3

  # --- nestjs (api / worker / bot) ---
  "@nestjs/common": ^11.0.0
  "@nestjs/core": ^11.0.0
  "@nestjs/platform-express": ^11.0.0
  "@nestjs/testing": ^11.0.0
  "@nestjs/cli": ^11.0.0
  "@nestjs/schematics": ^11.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1

  # --- object storage (R2 / MinIO) ---
  "@aws-sdk/client-s3": ^3.700.0
  "@aws-sdk/s3-request-presigner": ^3.700.0

  # --- auth ---
  "@nestjs/jwt": ^11.0.2
  "@node-rs/argon2": ^2.2.0
  cookie-parser: ^1.4.7
  "@types/cookie-parser": ^1.4.10

  # --- express (runtime lo trae @nestjs/platform-express; lo declaramos para
  #     que TS resuelva `import type { Request } from 'express'`) ---
  express: ^5.2.1
  "@types/express": ^5.0.6

  # --- logging ---
  "nestjs-pino": ^4.3.0
  pino: ^9.6.0
  pino-http: ^10.4.0
  pino-pretty: ^13.0.0

  # --- colas / redis ---
  bullmq: ^5.34.0
  ioredis: ^5.4.2
  cron-parser: ^5.0.0

  # --- bot ---
  "nestjs-telegraf": ^2.9.1
  telegraf: ^4.16.3

  # --- web (next) ---
  next: ^15.1.4
  eslint-config-next: ^15.1.4
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  # estilos: Tailwind v4 (sin tailwind.config; tokens en globals.css)
  tailwindcss: ^4.0.0
  "@tailwindcss/postcss": ^4.0.0
  # datos de servidor, formularios, i18n (ver ARQUITECTURA.md §5.1)
  "@tanstack/react-query": ^5.62.0
  react-hook-form: ^7.54.0
  "@hookform/resolvers": ^3.9.1
  next-intl: ^3.26.0
  recharts: ^2.15.0
