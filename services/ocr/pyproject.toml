[project]
name = "fijaprecio-ocr"
version = "0.0.0"
description = "Microservicio de OCR de boletas (FijaPrecio)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "structlog>=24.4",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
# PaddleOCR es pesado (~2 GB con paddlepaddle). El adaptador existe siempre;
# instala este extra en la imagen que quiera usarlo:  uv sync --extra paddle
paddle = ["paddleocr>=2.9", "paddlepaddle>=2.6"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "pytesseract", "paddleocr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
