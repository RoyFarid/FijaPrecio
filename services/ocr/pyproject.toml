[project]
name = "fijaprecio-ocr"
version = "0.0.0"
description = "Microservicio de OCR de boletas (FijaPrecio)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "structlog>=24.4",
    # OCR self-host. paddleocr es pesado; se puede diferir tras la interfaz OcrProvider.
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
